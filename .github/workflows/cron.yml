name: Daily Kitsu collection
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'
permissions:
  contents: write
  packages: write
concurrency:
  group: kitsu-daily-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run cron
      - name: Sign and commit data
        id: commit
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_EMAIL: ${{ secrets.GH_EMAIL }}
        run: |
          printf '%s' "$GPG_KEY" | gpg --batch --import
          git config user.name "$GH_USERNAME"
          git config user.email "$GH_EMAIL"
          git config user.signingkey "$GPG_SIGNING_KEY"
          git config commit.gpgsign true
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: add data for $(date -u +%F)"
            git push origin HEAD:master
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  publish:
    needs: collect
    uses: ./.github/workflows/static.yml
    with:
      revision: ${{ needs.collect.outputs.revision }}
    secrets: inherit
